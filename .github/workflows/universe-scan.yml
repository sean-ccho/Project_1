name: Universe Scan

# 전체 분석 (표시 전용) — 필터 없이 S&P 500 전체 · S&P 밖 NASDAQ/NYSE 상장 보통주 전부 · 신규 상장 (src/run_universe_scan.py).
# 일일 실행(run-screener.yml)이 이미 6시간 잡 한도에 가까워서 다른 러너에서 따로 돈다 — 실패해도 매매·메일·상태와 무관하다.
# 결과: 구글 시트 [SP500 전체]·[NASDAQ/NYSE 전체]·[신규상장] + 웹 '전체분석' 데이터(universe-data 고아 브랜치).
# push 로는 돌지 않는다 (코드만 바꾼 push 가 장중 데이터로 덮어쓰지 않게) — 예약 실행 또는 Actions 화면의 Run workflow.

# 실행 신호: Mac mini LaunchAgent(com.seancho.nightly-universe, scripts/launchagent/)가 매일 6:30 PM ET 에 workflow_dispatch API 를 부른다.
# schedule 은 예비 — 'gate' 잡이 최근 20시간 안에 workflow_dispatch 실행이 있으면 조용히 끝난다.
on:
  workflow_dispatch:
  schedule:
    - cron: '35 0 * * *'  # 예비 — 00:35 UTC = 7:35 PM EST / 8:35 PM EDT (Mac 신호 6:30 PM ET 보다 뒤)

permissions:
  contents: write

concurrency:
  group: universe-scan
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '20 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/universe-scan.yml/runs?event=workflow_dispatch&created=%3E%3D${since}&per_page=1" --jq '.total_count') || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "⏭️  최근 20시간 안에 Mac 신호 실행이 있음 — 예비 실행 건너뜀"
            echo "run=0" >> "$GITHUB_OUTPUT"
          else
            echo "▶️  Mac 신호 실행 없음 — 예비로 실행"
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      PYTHONUNBUFFERED: '1'
      # SEC EDGAR 공시 경고 — SEC 규칙상 요청에 연락처. 없으면 경고만 건너뛴다
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tenacity

      - name: Restore Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > gspread-service-account.json

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 경기순환/방어 × 내수/글로벌 — SEC 10-K 미국 매출 비중 (geo-revenue.yml 이 매달 geo-data 브랜치에 올림). 없으면 업종 기준
      - name: Get geo revenue (SEC)
        run: |
          if curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/geo-data/geo_revenue.csv" -o "$RUNNER_TEMP/geo_revenue.csv"; then
            echo "GEO_REVENUE_FILE=$RUNNER_TEMP/geo_revenue.csv" >> "$GITHUB_ENV"
            echo "✅ geo_revenue.csv $(wc -l < "$RUNNER_TEMP/geo_revenue.csv")줄"
          else
            echo "⏭️  geo_revenue.csv 없음 — 매출 지역은 업종 기준"
          fi

      # Yahoo 종목 정보가 막힌 날 재무·섹터를 채울 전날 값 (없으면 실전 스냅샷 data/paper_trading 으로)
      # + 종목 상세 분기 실적 · 의견 수 캐시 (detail.json.gz — 매일 조금씩 받아 쌓는다, web_export/stock_detail.py)
      # + 이미 읽은 국회의원 거래 신고 (congress_state.json.gz — 다음 밤엔 새 신고 PDF 만 받는다, data/congress_trades.py)
      # + 예측 모델 연간 재무 캐시 · 앞으로 기록 · 전날 결과 (value_fund.json.gz · value_log.json · value_model.json, web_export/value_model.py)
      # + 저자 블로그 감지 기준 (blog_watch.json — 일주일에 한 번 받은 사이트맵 · 커버리지 · 알린 소식, web_export/blog_watch.py)
      - name: Restore previous universe snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if git fetch -q --depth 1 origin universe-data 2>/dev/null; then
            for f in sp500_ranked.parquet nasdaq_ranked.parquet detail.json.gz congress_state.json.gz \
                     value_fund.json.gz value_log.json; do
              git show "FETCH_HEAD:snapshot/$f" > "$RUNNER_TEMP/prev/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/prev/$f"
            done
            for f in value_model.json blog_watch.json; do
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/prev/$f"
            done
          fi
          ls -la "$RUNNER_TEMP/prev"

      # 국회의원 거래 신고 (하원 PTR, 2026-11-06 · 표시 전용) — 스캔이 같은 폴더의 congress_tickers.json 을 읽어 목록 칩 ·
      # 종목 파일에 붙인다. 실패해도 스캔은 계속 (칩 · 카드 · 오늘 탭 칸만 없다)
      - name: Congress trades (House PTR)
        run: |
          PYTHONPATH=.:src python -m data.congress_trades --out-dir "$RUNNER_TEMP/universe" --prev-dir "$RUNNER_TEMP/prev" \
            | tee "$RUNNER_TEMP/congress.log" \
            || echo "::warning title=국회의원 거래 실패::하원 PTR 을 받지 못했습니다 (전체분석은 계속 진행)."

      - name: Run universe scan
        run: |
          PYTHONPATH=.:src python src/run_universe_scan.py \
            --out-dir "$RUNNER_TEMP/universe" --prev-dir "$RUNNER_TEMP/prev" | tee "$RUNNER_TEMP/universe_scan.log"

      # 저자 블로그 새 글 · 커버리지 변경 감지 (2026-11-11 · 표시 전용) — 예측 모델 위쪽 1~8절은 고정 글이라, 일주일에 한 번
      # 저자 사이트맵 · 커버리지 페이지를 받아 정리 안 된 새 글 · 정리한 뒤 고친 글 · 커버리지 차이를 blog_watch.json 에 남기고
      # 처음 보는 소식만 ntfy 로 한 번 알린다 (사이 밤엔 받지 않는다). 전날 파일을 먼저 옮겨 둬서 실패해도 기준이 안 지워진다.
      # 예측 모델보다 먼저 — 예측 모델이 이 파일의 커버리지 페이지 목록을 저자 커버리지로 쓴다 (2026-11-12).
      - name: Blog watch (예측 모델 · 저자 새 글 감지)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/prev/blog_watch.json" ]; then cp "$RUNNER_TEMP/prev/blog_watch.json" "$RUNNER_TEMP/universe/"; fi
          PYTHONPATH=.:src python -m web_export.blog_watch --out-dir "$RUNNER_TEMP/universe" --prev-dir "$RUNNER_TEMP/prev" \
            | tee "$RUNNER_TEMP/blog_watch.log" \
            || echo "::warning title=블로그 감지 실패::blog_watch.json 을 새로 만들지 못했습니다 (전날 결과 유지 · 전체분석은 계속)."

      # 예측 모델 (2026-11-11 · 표시 전용) — 사이트 내계좌 › 예측 모델. Baoro 블로그 로직(docs/블로그주식분석.md 9절)의
      # 품질 관문 5개 + 가격 관문을 우리 대상(2026-11-12: 미국 상장 + TSX, 시가총액 US$10억 이상, 금융 · 리츠 제외 — 위 스캔 ·
      # canada-data 의 시가총액으로 정함, 같은 회사는 하나 — 약 2,100종목)에 적용해 주니어(v1) · 시니어(v2) 목록을 만들고, 저자 종목(커버리지 =
      # 위 블로그 감지가 읽은 페이지 목록 + 리서치 글)은 대상 밖이어도 비교용으로 계산한다. 연간 재무는
      # snapshot/value_fund.json.gz 에 쌓아 30일마다 다시 받고(하룻밤 20분 한도 — 넓힌 첫 밤은 대부분 새로 받음), 기록은
      # snapshot/value_log.json (대상 재무를 95% 받은 밤부터 시작). 먼저 전날 파일을 옮겨 둬서 실패해도 지워지지 않는다.
      # 실패해도 스캔은 계속.
      - name: Value model (예측 모델)
        run: |
          set -o pipefail  # python 이 실패하면 tee 대신 그 실패로 → 아래 경고가 뜬다
          mkdir -p "$RUNNER_TEMP/universe/snapshot"
          for f in value_fund.json.gz value_log.json; do
            if [ -f "$RUNNER_TEMP/prev/$f" ]; then cp "$RUNNER_TEMP/prev/$f" "$RUNNER_TEMP/universe/snapshot/$f"; fi
          done
          if [ -f "$RUNNER_TEMP/prev/value_model.json" ]; then cp "$RUNNER_TEMP/prev/value_model.json" "$RUNNER_TEMP/universe/"; fi
          # Yahoo 종목 정보가 막혀 빈 값이면(11-12 밤 513종목 전부) 같은 밤 전체분석의 시가총액 · 업종 · 이름으로 채운다 —
          # 미국은 위 스캔이 쓴 파일, 캐나다 종목은 canada-data (Canada Scan 이 이 단계 전에 끝난다). prev 에 두면
          # fundamentals_guard 가 미국 스캔 보충에 같이 읽으니 따로 둔다
          mkdir -p "$RUNNER_TEMP/ca_scan"
          if git fetch -q --depth 1 origin canada-data 2>/dev/null; then
            git show "FETCH_HEAD:snapshot/ca_ranked.parquet" > "$RUNNER_TEMP/ca_scan/ca_ranked.parquet" 2>/dev/null \
              || rm -f "$RUNNER_TEMP/ca_scan/ca_ranked.parquet"
            git show "FETCH_HEAD:ca.json.gz" > "$RUNNER_TEMP/ca_scan/ca.json.gz" 2>/dev/null || rm -f "$RUNNER_TEMP/ca_scan/ca.json.gz"
          fi
          PYTHONPATH=.:src python -m web_export.value_model --out-dir "$RUNNER_TEMP/universe" --prev-dir "$RUNNER_TEMP/prev" \
            --ca-dir "$RUNNER_TEMP/ca_scan" \
            | tee "$RUNNER_TEMP/value_model.log" \
            || echo "::warning title=예측 모델 실패::value_model.json 을 새로 만들지 못했습니다 (전날 결과 유지 · 전체분석은 계속)."

      - name: Upload universe scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-scan-log
          path: ${{ runner.temp }}/universe_scan.log
          retention-days: 7

      - name: Push universe data (orphan branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/universe"
          git init -q -b universe-data
          git add -A
          git commit -q -m "universe data $(date +%s) [skip ci]"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" universe-data
          date +%s > "$RUNNER_TEMP/web_pushed_at"
          echo "✅ universe-data 브랜치 업데이트 완료 ($(git ls-files | wc -l) 파일)"

      # 웹사이트 캐시를 비운다 — 목록은 브라우저가 raw 에서 바로 받지만, 종목 상세 페이지는 서버 캐시를 쓴다.
      # raw.githubusercontent 는 최대 5분 캐시라서 push 후 5분이 지난 뒤에 부른다 (run-screener.yml 과 같다).
      - name: Refresh personal website
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://seancho.vercel.app
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "⏭️  REVALIDATE_SECRET 없음, 건너뜀 (사이트는 30분 자동 갱신)"
            exit 0
          fi
          wait=$(( $(cat "$RUNNER_TEMP/web_pushed_at") + 310 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "⏳ GitHub raw 캐시가 빠지도록 ${wait}초 기다림"
            sleep "$wait"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${REVALIDATE_SECRET}" "$SITE_URL/api/revalidate" || true)
          if [ "$code" = "200" ]; then
            echo "✅ 웹사이트 갱신 요청 완료"
          else
            echo "::warning title=웹사이트 갱신 실패::HTTP $code — 사이트는 30분 자동 갱신으로 늦게 반영됩니다."
          fi
