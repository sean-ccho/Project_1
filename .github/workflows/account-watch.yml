name: Account Watch

# 내계좌 장중 30분 체크 (src/screener/account_watch.py) — 시트는 읽기만, 매매·상태·메인 브랜치와 무관하다.
# 매번 ntfy 로 요약 푸시(현재가·오늘 ±%·매수 대비 ±%), 새 알림(손절·근접·목표가·±5%·관심종목)이 있으면 ntfy + 메일.
# 같은 알림 하루 한 번용 state.json 은 고아 브랜치 account-watch 에 둔다 (main 에 push 하지 않으니 run-screener 가 다시 돌지 않는다).
#
# 예약 실행(schedule)은 쓰지 않는다 — 이 저장소의 GitHub 예약은 4~5시간씩 늦어서(밤 작업 20:45 → 01:19) 30분 체크가 안 됐다 (2026-10-21).
# 대신 Mac mini LaunchAgent(com.seancho.account-watch, ~/account-watch/trigger.sh)가 평일 장중 :07·:37 에
# workflow_dispatch API 를 부른다. 장 시간·휴장 판단은 스크립트가 한다 (force 를 켜면 건너뜀).

on:
  workflow_dispatch:
    inputs:
      force:
        description: '장 시간 밖·휴장이어도 실행'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: account-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-watch.txt

      - name: Install dependencies
        run: pip install -r requirements-watch.txt

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore alert state
        run: |
          mkdir -p "$RUNNER_TEMP/aw"
          if git fetch -q --depth 1 origin account-watch 2>/dev/null; then
            git show FETCH_HEAD:state.json > "$RUNNER_TEMP/aw/state.json" 2>/dev/null || rm -f "$RUNNER_TEMP/aw/state.json"
          fi
          (sha1sum "$RUNNER_TEMP/aw/state.json" 2>/dev/null || echo none) | cut -d' ' -f1 > "$RUNNER_TEMP/aw_before"
          cat "$RUNNER_TEMP/aw/state.json" 2>/dev/null || echo "(상태 없음 — 새로 시작)"

      - name: Run account watch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          PYTHONPATH=.:src python src/screener/account_watch.py --state "$RUNNER_TEMP/aw/state.json" $FORCE

      - name: Save alert state (orphan branch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/aw/state.json"
          if [ ! -f "$f" ]; then echo "상태 파일 없음 — 건너뜀"; exit 0; fi
          if [ "$(sha1sum "$f" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/aw_before")" ]; then
            echo "상태 변화 없음 — 건너뜀"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/aw_push" && cp "$f" "$RUNNER_TEMP/aw_push/state.json" && cd "$RUNNER_TEMP/aw_push"
          git init -q -b account-watch
          git add state.json
          git commit -q -m "account watch state $(date +%s) [skip ci]"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" account-watch
          echo "✅ account-watch 상태 저장"
