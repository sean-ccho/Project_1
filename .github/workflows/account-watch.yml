name: Account Watch

# 내계좌 장중 30분 체크 (src/screener/account_watch.py) — 시트는 읽기만, 매매·상태·메인 브랜치와 무관하다.
# 매번 ntfy 로 요약 푸시(현재가·오늘 ±%·매수 대비 ±%), 새 알림(손절·근접·목표가·±5%·관심종목)이 있으면 ntfy + 메일.
# 같은 알림 하루 한 번용 state.json 은 고아 브랜치 account-watch 에 둔다 (main 에 push 하지 않으니 run-screener 가 다시 돌지 않는다).
#
# 실행 신호: Mac mini LaunchAgent(com.seancho.account-watch, ~/account-watch/trigger.sh)가 월~금 09:30~16:00
# 30분마다 workflow_dispatch API 를 부른다. 이 저장소의 GitHub 예약은 4~5시간씩 늦어서(밤 작업 20:45 → 01:19)
# 2026-10-21 장중 예약이 한 번도 안 돌았다 — 그래서 schedule 은 예비로만 둔다: --backup 으로 돌아서
# 45분 안에 체크한 적이 있으면(Mac 정상) 조용히 끝나고, Mac 이 꺼진 날에만 실제로 체크한다.
# 장 시간·휴장 판단은 스크립트가 한다 (force 를 켜면 건너뜀).

on:
  workflow_dispatch:
    inputs:
      force:
        description: '장 시간 밖·휴장이어도 실행'
        type: boolean
        default: false
  schedule:
    # 예비 — UTC 라 EDT·EST 장 시간을 모두 덮고, 월~금 09:30~16:10 ET 밖이면 첫 스텝에서 바로 끝난다
    - cron: '0,30 13-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: account-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Market-hours gate
        id: gate
        run: |
          read -r dow hm < <(TZ=America/Toronto date '+%u %H%M')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$dow" -le 5 ] && (( 10#$hm >= 930 && 10#$hm < 1610 )); }; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️  장 시간 밖 ($(TZ=America/Toronto date '+%a %H:%M %Z')) — 건너뜀"
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-watch.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == '1'
        run: pip install -r requirements-watch.txt

      - name: Configure git identity
        if: steps.gate.outputs.run == '1'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore alert state
        if: steps.gate.outputs.run == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/aw"
          if git fetch -q --depth 1 origin account-watch 2>/dev/null; then
            git show FETCH_HEAD:state.json > "$RUNNER_TEMP/aw/state.json" 2>/dev/null || rm -f "$RUNNER_TEMP/aw/state.json"
          fi
          (sha1sum "$RUNNER_TEMP/aw/state.json" 2>/dev/null || echo none) | cut -d' ' -f1 > "$RUNNER_TEMP/aw_before"
          cat "$RUNNER_TEMP/aw/state.json" 2>/dev/null || echo "(상태 없음 — 새로 시작)"

      - name: Run account watch
        if: steps.gate.outputs.run == '1'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          BACKUP: ${{ github.event_name == 'schedule' && '--backup' || '' }}
        run: |
          PYTHONPATH=.:src python src/screener/account_watch.py --state "$RUNNER_TEMP/aw/state.json" $FORCE $BACKUP

      - name: Save alert state (orphan branch)
        if: always() && steps.gate.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/aw/state.json"
          if [ ! -f "$f" ]; then echo "상태 파일 없음 — 건너뜀"; exit 0; fi
          if [ "$(sha1sum "$f" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/aw_before")" ]; then
            echo "상태 변화 없음 — 건너뜀"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/aw_push" && cp "$f" "$RUNNER_TEMP/aw_push/state.json" && cd "$RUNNER_TEMP/aw_push"
          git init -q -b account-watch
          git add state.json
          git commit -q -m "account watch state $(date +%s) [skip ci]"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" account-watch
          echo "✅ account-watch 상태 저장"
