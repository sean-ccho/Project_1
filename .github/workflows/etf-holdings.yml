name: ETF Holdings (SEC N-PORT)

# ETF 전체 보유 종목 — SEC N-PORT (src/data/etf_holdings.py, 표시 전용: ETF 성격 · 내 계좌 쏠림).
# ETF 목록(data.etf_universe)의 미국 ETF 마다 최신 NPORT-P 를 받아 고아 브랜치 etf-data 에 etf_holdings.csv 로 올린다.
# N-PORT 는 분기 말 기준 60일 뒤 공개라 매달 한 번이면 충분 — 이전 파일과 공시 번호가 같은 ETF 는 다시 받지 않는다.
# run-screener.yml 이 밤마다 이 파일을 ETF_HOLDINGS_FILE 로 받는다. 밤 실행과 안 겹치게 낮에.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 5 * *'  # 매달 5일 15:30 UTC = 11:30 AM EDT

permissions:
  contents: write

concurrency:
  group: etf-holdings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: '1'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Get previous file
        run: |
          curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/etf-data/etf_holdings.csv" -o "$RUNNER_TEMP/prev.csv" \
            && echo "이전 파일 $(wc -l < "$RUNNER_TEMP/prev.csv")줄" || echo "이전 파일 없음 — 전부 받는다"

      - name: Build etf_holdings.csv
        run: |
          mkdir -p "$RUNNER_TEMP/etf"
          PYTHONPATH=.:src python -m data.etf_holdings --prev "$RUNNER_TEMP/prev.csv" \
            --out "$RUNNER_TEMP/etf/etf_holdings.csv" --budget-min 60

      - name: Push ETF data (orphan branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/etf"
          if [ ! -s etf_holdings.csv ] || [ "$(wc -l < etf_holdings.csv)" -lt 100 ]; then
            echo "::warning title=ETF 보유 종목 비어 있음::etf_holdings.csv 가 거의 비어 있어 올리지 않습니다 (이전 파일 유지)."
            exit 0
          fi
          git init -q -b etf-data
          git add etf_holdings.csv
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "etf holdings $(date +%F) [skip ci]"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" etf-data
          echo "✅ etf-data 브랜치 업데이트 완료"
