name: Run Screener

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'  # 00:45 UTC = 8:45 PM EDT, 매일 실행

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: '1'
      # SEC EDGAR 공시 경고 (src/screener/sec_filings.py) — SEC 규칙상 요청에 연락처. 없으면 경고만 건너뛴다
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tenacity  # retry 라이브러리
          pip install pytest    # 유닛 테스트 (빠져 있던 동안 테스트 스텝이 'pytest: command not found' 로 그냥 넘어갔다)

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 실패해도 파이프라인은 계속 — 대신 실행 요약 화면에 경고로 띄운다 (requirements 가 '>=' 라 매번 최신 라이브러리가 깔린다)
      - name: Run unit tests
        run: |
          PYTHONPATH=.:src pytest tests/ -q --tb=short \
            || echo "::warning title=유닛 테스트 실패::실패한 테스트가 있습니다 (파이프라인은 계속 진행). 'Run unit tests' 스텝 로그를 보세요."

      - name: Restore Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > gspread-service-account.json

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 경기순환/방어 × 내수/글로벌 — SEC 10-K 미국 매출 비중 (geo-revenue.yml 이 매달 geo-data 브랜치에 올림). 없으면 업종 기준
      - name: Get geo revenue (SEC)
        run: |
          if curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/geo-data/geo_revenue.csv" -o "$RUNNER_TEMP/geo_revenue.csv"; then
            echo "GEO_REVENUE_FILE=$RUNNER_TEMP/geo_revenue.csv" >> "$GITHUB_ENV"
            echo "✅ geo_revenue.csv $(wc -l < "$RUNNER_TEMP/geo_revenue.csv")줄"
          else
            echo "⏭️  geo_revenue.csv 없음 — 매출 지역은 업종 기준"
          fi

      - name: Set log date
        run: echo "LOG_DATE=$(TZ='America/Toronto' date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Yahoo Finance connectivity check
        run: |
          echo "=== Runner IP ==="
          curl -s https://api.ipify.org && echo ""
          echo ""
          echo "=== Yahoo Finance API 진단 ==="
          python -c "
          import yfinance as yf
          import sys

          print(f'yfinance version: {yf.__version__}')
          print()

          # 1) 단일 티커 다운로드 테스트
          print('--- Test 1: yf.download (AAPL, 5d) ---')
          try:
              data = yf.download('AAPL', period='5d', progress=False)
              if data.empty:
                  print('⚠️  다운로드 성공했지만 데이터가 비어 있음 (rate limit 가능성)')
              else:
                  print(f'✅ 성공: {len(data)}행 반환')
                  print(data.tail(2))
          except Exception as e:
              print(f'❌ 실패: {e}')
              if 'Unauthorized' in str(e) or 'Invalid Crumb' in str(e) or '401' in str(e):
                  print('🚫 Yahoo Finance가 이 IP를 차단한 것으로 보입니다')
                  sys.exit(1)

          print()

          # 2) Ticker.info 테스트 (crumb/cookie 필요)
          print('--- Test 2: yf.Ticker.get_info (AAPL) ---')
          try:
              info = yf.Ticker('AAPL').get_info()
              name = info.get('shortName', 'N/A')
              price = info.get('currentPrice') or info.get('regularMarketPrice', 'N/A')
              print(f'✅ 성공: {name}, \${price}')
          except Exception as e:
              print(f'❌ 실패: {e}')
              if 'Unauthorized' in str(e) or 'Invalid Crumb' in str(e) or '401' in str(e):
                  print('🚫 Yahoo Finance가 이 IP를 차단한 것으로 보입니다')
                  sys.exit(1)

          print()
          print('=== Yahoo Finance 접속 정상 ===')
          "

      - name: Run screener pipeline
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TRADINGVIEW_SESSIONID: ${{ secrets.TRADINGVIEW_SESSIONID }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/main.py | tee logs/$LOG_DATE/sp500_analysis.log

      - name: Run full market scan
        if: always()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TRADINGVIEW_SESSIONID: ${{ secrets.TRADINGVIEW_SESSIONID }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/run_full_scan.py | tee logs/$LOG_DATE/full_scan.log

      # 숏스퀴즈 감시 (표시 전용, src/screener/short_squeeze.py) — PT 메일·웹·내계좌 리포트가 읽는다. 실패해도 계속
      - name: Short squeeze watch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python -m screener.short_squeeze | tee logs/$LOG_DATE/short_squeeze.log

      - name: Upload screener log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-log
          path: logs/${{ env.LOG_DATE }}/sp500_analysis.log
          retention-days: 7

      - name: Upload full scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scan-log
          path: logs/${{ env.LOG_DATE }}/full_scan.log
          retention-days: 7

      - name: Run unified paper trading
        if: always()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TRADINGVIEW_SESSIONID: ${{ secrets.TRADINGVIEW_SESSIONID }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/paper_trading/run_paper_trading.py | tee logs/$LOG_DATE/paper_trading.log

      - name: Upload paper trading log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-log
          path: logs/${{ env.LOG_DATE }}/paper_trading.log
          retention-days: 7

      - name: Run PT-1S (PT-1 rules, S&P 500 only)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/paper_trading/run_paper_trading.py --account pt1s | tee logs/$LOG_DATE/paper_trading_pt1s.log

      - name: Run PT-1N (PT-1 rules, non-S&P 500 NASDAQ/NYSE only)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/paper_trading/run_paper_trading.py --account pt1n | tee logs/$LOG_DATE/paper_trading_pt1n.log

      - name: Run PT-SPY (SPY buy & hold benchmark)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/paper_trading/run_paper_trading.py --account pt_spy | tee logs/$LOG_DATE/paper_trading_pt_spy.log

      - name: Run 내계좌 portfolio report
        if: always()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python src/screener/portfolio_report.py | tee logs/$LOG_DATE/portfolio_report.log

      - name: Upload portfolio report log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-report-log
          path: logs/${{ env.LOG_DATE }}/portfolio_report.log
          retention-days: 7

      # 계좌 상태·스냅샷 일봉·에러 로그·메일 발송을 내용으로 확인. 실패가 하나라도 있으면 exit 1 → 실패 알림 메일.
      # 결과 표는 logs/ 에 남겨 같이 커밋하고, 계좌별 마지막 처리 일봉은 아래 'Verify state pushed' 가 쓴다.
      - name: Health check
        if: always()
        run: |
          set -o pipefail
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python -m monitoring.health_check --log-date "$LOG_DATE" \
            --expected-out "$RUNNER_TEMP/expected_state.json" | tee logs/$LOG_DATE/health_check.log

      # 상태 커밋은 스크린샷 push 보다 먼저 — 스크린샷 스텝의 'git checkout -f main' 이 커밋 안 된 변경
      # (로그·스냅샷·positions/trades/state)을 지운다 (2026-10-09 차트 캡처를 다시 켠 시험 실행에서 확인)
      - name: Commit & push logs and paper trading state
        if: always()
        run: |
          git add logs/$LOG_DATE/
          git add data/paper_trading/positions.json \
                  data/paper_trading/trades.json \
                  data/paper_trading/sp500_ranked.parquet \
                  data/paper_trading/nasdaq_ranked.parquet
          git add data/paper_trading/squeeze_watch.parquet 2>/dev/null || true
          git add data/paper_trading/state.json 2>/dev/null || true
          # 계좌 폴더별로 따로 add — 한 계좌 폴더가 없어도 다른 계좌 상태는 커밋되게
          for d in pt1s pt1n pt_spy; do
            if ls data/paper_trading/$d/*.json >/dev/null 2>&1; then git add data/paper_trading/$d/*.json; fi
          done
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update logs and paper trading state ($LOG_DATE) [skip ci]"
          # 실행 중에 main 에 다른 push 가 들어오면 그냥 push 는 거부된다 → 받아서 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push 실패 (시도 $i/3) — 5초 뒤 다시"
            sleep 5
          done
          exit 1

      # 이번 실행의 계좌 상태가 실제로 origin/main 에 올라갔는지 — 2026-10-09~11 에 커밋 전 상태가 지워져
      # 같은 일봉을 사흘 연속 다시 처리했다 (헬스체크는 커밋 전에 돌아 못 잡았다). 스크린샷 스텝은 main 을 안 건드린다.
      - name: Verify state pushed
        if: always()
        run: |
          set -o pipefail
          PYTHONPATH=.:src python -m monitoring.health_check \
            --verify-pushed "$RUNNER_TEMP/expected_state.json" | tee "$RUNNER_TEMP/verify_pushed.log"

      # 웹 '전체차트' — 두 분석 시트의 종목 중 차트분석(점수 5.0+)에서 캡처하지 않은 종목 (charts/capture_remaining.py).
      # 실전 단계(PT·메일·상태 커밋)가 다 끝난 뒤에 돌린다. 90분 넘으면 남은 종목은 건너뛴다. 실패해도 계속.
      - name: Capture remaining charts (web 전체차트)
        if: always()
        continue-on-error: true
        timeout-minutes: 100
        env:
          TRADINGVIEW_SESSIONID: ${{ secrets.TRADINGVIEW_SESSIONID }}
        run: |
          mkdir -p logs/$LOG_DATE
          PYTHONPATH=.:src python -m charts.capture_remaining --budget-min 90 | tee "$RUNNER_TEMP/capture_remaining.log"

      # 개인 웹사이트(별도 리포)가 읽는 dashboard.json — 차트 폴더 목록을 읽어야 해서 스크린샷 push 보다 먼저
      # (스크린샷 스텝의 'git checkout -f main' 이 차트 폴더를 지운다). 파일은 리포 밖 RUNNER_TEMP 에 둔다.
      # 사이트 ETF 탭(/quant/etf)과 시트 [ETF] — 묶음별 ETF 정보 · 수익률 · 추세 · 위험, 표시 전용 (2026-10-28)
      - name: ETF scan
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          PYTHONPATH=.:src python -m screener.etf_scan --out "$RUNNER_TEMP/web/etf.json" \
            --detail-out "$RUNNER_TEMP/web/etf_detail.json" --sheet \
            || echo "::warning title=ETF 스캔 실패::etf.json · 시트 [ETF] 를 만들지 못했습니다 (파이프라인은 계속 진행)."

      # 사이트 오늘 탭(/quant) '경기 상태 · 금리 결정'과 시트 [경제] — FRED 지표 · SPY · 순환/방어 ETF ·
      # FOMC/BoC 일정과 지난 결정, 표시 전용 (2026-10-30)
      - name: Macro scan
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          PYTHONPATH=.:src python -m screener.macro_scan --out "$RUNNER_TEMP/web/macro.json" --sheet \
            || echo "::warning title=경제 스캔 실패::macro.json · 시트 [경제] 를 만들지 못했습니다 (파이프라인은 계속 진행)."

      - name: Export web dashboard data
        if: always()
        run: |
          PYTHONPATH=.:src python -m web_export.dashboard --out "$RUNNER_TEMP/web/dashboard.json" \
            || echo "::warning title=웹 데이터 내보내기 실패::dashboard.json 을 만들지 못했습니다 (파이프라인은 계속 진행)."

      - name: Push chart screenshots (orphan branch — no history accumulation)
        if: always()
        run: |
          # SP500 스크린샷 → screenshots-sp500 브랜치 (히스토리 없이 매번 교체)
          if [ -d "charts/screenshots_sp500" ] && [ "$(ls -A charts/screenshots_sp500 2>/dev/null)" ]; then
            echo "📸 SP500 스크린샷 orphan 푸시 중..."
            git checkout --orphan screenshots-sp500-tmp
            git reset
            git add -f charts/screenshots_sp500
            git commit -m "screenshots update $(date +%s) [skip ci]"
            git push origin screenshots-sp500-tmp:screenshots-sp500 --force
            git checkout -f main
            git branch -D screenshots-sp500-tmp
            echo "✅ screenshots-sp500 브랜치 업데이트 완료"
          else
            echo "⏭️  SP500 스크린샷 없음, 건너뜀"
          fi

          # NASDAQ/NYSE 스크린샷 → screenshots-nasdaq 브랜치
          if [ -d "charts/screenshots_nasdaq" ] && [ "$(ls -A charts/screenshots_nasdaq 2>/dev/null)" ]; then
            echo "📸 NASDAQ 스크린샷 orphan 푸시 중..."
            git checkout --orphan screenshots-nasdaq-tmp
            git reset
            git add -f charts/screenshots_nasdaq
            git commit -m "screenshots update $(date +%s) [skip ci]"
            git push origin screenshots-nasdaq-tmp:screenshots-nasdaq --force
            git checkout -f main
            git branch -D screenshots-nasdaq-tmp
            echo "✅ screenshots-nasdaq 브랜치 업데이트 완료"
          else
            echo "⏭️  NASDAQ 스크린샷 없음, 건너뜀"
          fi

          # 전체차트 (WebP) → screenshots-all 브랜치
          if [ -d "charts/screenshots_all" ] && [ "$(ls -A charts/screenshots_all 2>/dev/null)" ]; then
            echo "📸 전체차트 orphan 푸시 중..."
            git checkout --orphan screenshots-all-tmp
            git reset
            git add -f charts/screenshots_all
            git commit -m "screenshots update $(date +%s) [skip ci]"
            git push origin screenshots-all-tmp:screenshots-all --force
            git checkout -f main
            git branch -D screenshots-all-tmp
            echo "✅ screenshots-all 브랜치 업데이트 완료"
          else
            echo "⏭️  전체차트 없음, 건너뜀"
          fi

      # dashboard.json → dashboard-data 브랜치 (히스토리 없이 매번 교체). main 작업 폴더를 건드리지 않게
      # 임시 폴더에서 따로 만든 저장소로 push 한다. 웹사이트는 이 브랜치의 raw 주소만 읽는다.
      - name: Push web dashboard data (orphan branch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$RUNNER_TEMP/web/dashboard.json" ]; then
            echo "⏭️  dashboard.json 없음, 건너뜀"
            exit 0
          fi
          cd "$RUNNER_TEMP/web"
          git init -q -b dashboard-data
          git add dashboard.json
          [ -f etf.json ] && git add etf.json   # ETF 탭 (없으면 사이트가 'ETF 데이터 없음'을 보여 줌)
          [ -f etf_detail.json ] && git add etf_detail.json   # ETF 줄을 펼치면 보이는 설명 · 보유 종목 (없으면 차트만)
          [ -f macro.json ] && git add macro.json   # 오늘 탭 경기 상태 · 금리 결정 (없으면 그 칸만 '데이터 없음')
          git commit -q -m "dashboard data $(date +%s) [skip ci]"
          if git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dashboard-data; then
            date +%s > "$RUNNER_TEMP/web_pushed_at"
            echo "✅ dashboard-data 브랜치 업데이트 완료"
          else
            echo "::warning title=웹 데이터 push 실패::dashboard-data 브랜치를 갱신하지 못했습니다 (파이프라인은 계속 진행)."
          fi

      # 개인 웹사이트에 새 데이터를 알려 /quant 캐시를 바로 비운다 (안 부르면 사이트 캐시가 겹쳐 최대 1시간 늦다).
      # raw.githubusercontent 는 최대 5분(max-age=300) 캐시라서 push 후 5분이 지나 옛 파일이 다 빠진 뒤에 부른다.
      - name: Refresh personal website
        if: always()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://seancho.vercel.app
        run: |
          if [ ! -f "$RUNNER_TEMP/web_pushed_at" ]; then
            echo "⏭️  새 dashboard.json 을 push 하지 않았음, 건너뜀"
            exit 0
          fi
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "⏭️  REVALIDATE_SECRET 없음, 건너뜀 (사이트는 30분 자동 갱신)"
            exit 0
          fi
          wait=$(( $(cat "$RUNNER_TEMP/web_pushed_at") + 310 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "⏳ GitHub raw 캐시가 빠지도록 ${wait}초 기다림"
            sleep "$wait"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${REVALIDATE_SECRET}" "$SITE_URL/api/revalidate" || true)
          if [ "$code" = "200" ]; then
            echo "✅ 웹사이트 갱신 요청 완료"
          else
            echo "::warning title=웹사이트 갱신 실패::HTTP $code — 사이트는 30분 자동 갱신으로 늦게 반영됩니다 (파이프라인은 계속 진행)."
          fi

      - name: Notify on failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          PYTHONPATH=.:src python -c "
          import smtplib
          from email.mime.text import MIMEText
          import os
          from pathlib import Path

          password = os.environ.get('EMAIL_PASSWORD', '')
          if not password:
              print('EMAIL_PASSWORD not set, skipping failure notification')
              exit(0)

          # 헬스 체크·state push 확인 결과 표를 본문에 붙인다 (어느 검사가 실패했는지 메일에서 바로 보이게)
          details = ''
          for p in (Path('logs') / os.environ.get('LOG_DATE', '') / 'health_check.log',
                    Path(os.environ['RUNNER_TEMP']) / 'verify_pushed.log'):
              if p.exists():
                  details += '\n\n' + p.read_text(encoding='utf-8', errors='replace')

          msg = MIMEText(
              '파이프라인 실행 중 오류가 발생했습니다.\n\n'
              'GitHub Actions 로그를 확인하세요:\n'
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' + details,
              'plain', 'utf-8'
          )
          msg['Subject'] = '⚠️ Screener Pipeline Failed - ${{ env.LOG_DATE }}'
          msg['From'] = 'chunghwan14@gmail.com'
          msg['To'] = 'chunghwan14@gmail.com'

          try:
              with smtplib.SMTP('smtp.gmail.com', 587) as s:
                  s.starttls()
                  s.login('chunghwan14@gmail.com', password)
                  s.send_message(msg)
              print('Failure notification email sent.')
          except Exception as e:
              print(f'Failed to send notification: {e}')
