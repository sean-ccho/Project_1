name: Run Screener

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'  # 22:00 UTC = 5:00 PM EST, 월~금만 실행

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Restore Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > gspread-service-account.json

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run screener pipeline
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -o pipefail
          PYTHONPATH=.:src python src/main.py | tee run.log

      - name: Run full market scan
        if: always()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -o pipefail
          PYTHONPATH=.:src python src/run_full_scan.py | tee full_scan.log

      - name: Upload screener log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-log
          path: run.log
          retention-days: 7

      - name: Upload full scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scan-log
          path: full_scan.log
          retention-days: 7
