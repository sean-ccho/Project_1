name: Run Full Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC = 11:00 PM EST (기존 스캐너 이후 실행)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > gspread-service-account.json

      - name: Run full market scan
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -o pipefail
          python run_full_scan.py | tee full_scan.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scan-log
          path: full_scan.log
          retention-days: 7
